---
apiVersion: v1
kind: Namespace
metadata:
  name: app-argo-rollouts
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout 
metadata:
  labels:
    app: argo-rollouts-deployment
  name: argo-rollouts-deployment
  namespace: app-argo-rollouts
spec:
  replicas: 3 
  selector:
    matchLabels:
      app: argo-rollouts-deployment
  template:
    metadata:
      labels:
        app: argo-rollouts-deployment
    spec:
      containers:
      - image: app-argo-rollouts
        name: app-argo-rollouts
        ports:
          - name: http
            containerPort: 5001
        resources:
          requests:
            cpu: "0.1"
            memory: "500M"
          limits:
            cpu: "0.4"
            memory: "1G" 
  strategy: {}
---
apiVersion: v1
kind: Service
metadata:
  name: argo-rollouts-deployment-http
  labels:
    app: argo-rollouts-deployment-http
spec:
  selector:
    app: argo-rollouts-deployment
  ports:
    - name: http 
      port: 5001
      targetPort: http 
---
apiVersion: v1
kind: Service
metadata:
  name: argo-rollouts-deployment-metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "5001"
    prometheus.io/path: "/metrics"
  labels:
    app: argo-rollouts-deployment-metrics
spec:
  selector:
    app: argo-rollouts-deployment
  ports:
    - name: metrics
      port: 5001
      targetPort: http 
