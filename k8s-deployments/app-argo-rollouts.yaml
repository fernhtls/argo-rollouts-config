---
apiVersion: v1
kind: Namespace
metadata:
  name: app-argo-rollouts
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: latency
spec:
  args:
  - name: app-name
  - name: predict-endpoint
  - name: canary-hash
  - name: stable-hash
  metrics:
  - name: app_request_duration_seconds_bucket
    interval: 1m
    # NOTE: prometheus queries return results in the form of a vector.
    # So it is common to access the index 0 of the returned array to obtain the value
    successCondition: len(result) > 0 && result[0] >= 0.95
    failureLimit: 3
    provider:
      prometheus:
        address: http://prometheus-server.prometheus.svc.cluster.local
        query: |
          (
            sum(rate(app_request_duration_seconds_bucket{le="0.5",app="{{args.app-name}}",endpoint="{{args.predict-endpoint}}",rollouts_pod_template_hash="{{args.canary-hash}}"}[5m]))
            /
            sum(rate(app_request_duration_seconds_bucket{le="+Inf",app="{{args.app-name}}",endpoint="{{args.predict-endpoint}}",rollouts_pod_template_hash="{{args.canary-hash}}"}[5m]))
          )
          -
          (
            sum(rate(app_request_duration_seconds_bucket{le="0.5",app="{{args.app-name}}",endpoint="{{args.predict-endpoint}}",rollouts_pod_template_hash="{{args.stable-hash}}"}[5m]))
            /
            sum(rate(app_request_duration_seconds_bucket{le="+Inf",app="{{args.app-name}}",endpoint="{{args.predict-endpoint}}",rollouts_pod_template_hash="{{args.stable-hash}}"}[5m]))
          )
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout 
metadata:
  labels:
    app: argo-rollouts-deployment
  name: argo-rollouts-deployment
  namespace: app-argo-rollouts
spec:
  replicas: 4
  selector:
    matchLabels:
      app: argo-rollouts-deployment
  template:
    metadata:
      labels:
        app: argo-rollouts-deployment
    spec:
      containers:
      - image: app-argo-rollouts
        name: app-argo-rollouts
        env:
        - name: POD_TEMPLATE_HASH
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['rollouts-pod-template-hash']
        ports:
          - name: http
            containerPort: 5001
        resources:
          requests:
            cpu: "1.0"
            memory: "1G"
          limits:
            cpu: "2.0"
            memory: "3G" 
  strategy: {}
---
apiVersion: v1
kind: Service
metadata:
  name: argo-rollouts-deployment-http
  labels:
    app: argo-rollouts-deployment-http
spec:
  selector:
    app: argo-rollouts-deployment
  ports:
    - name: http 
      port: 5001
      targetPort: http 
---
apiVersion: v1
kind: Service
metadata:
  name: argo-rollouts-deployment-metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "5001"
    prometheus.io/path: "/metrics"
  labels:
    app: argo-rollouts-deployment-metrics
spec:
  selector:
    app: argo-rollouts-deployment
  ports:
    - name: metrics
      port: 5001
      targetPort: http 
