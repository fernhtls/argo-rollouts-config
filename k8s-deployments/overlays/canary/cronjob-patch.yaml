apiVersion: batch/v1
kind: CronJob
metadata:
  name: oha-loadtest
spec:
  jobTemplate:
    metadata:
      name: oha-loadtest
    spec:
      template:
        spec:
          restartPolicy: "Never"
          containers:
          - image: localhost/oha-loadtest:latest
            name: oha-loadtest
            args:
              - "http://canary-argo-rollouts-deployment-http.app-argo-rollouts.svc.cluster.local:5001/predict"
              - "-m"
              - "POST"
              - "-H"
              - "'Content-Type: application/json'"
              - "-Z"
              - "./requests.ndjson"
              - "-q"
              - "20"
              - "-z"
              - "570s"
              - "-c"
              - "20"
              - "--no-tui"
            imagePullPolicy: "IfNotPresent" # We will load the image, so IfNotPresent or Never is enough
  schedule: '*/10 * * * *' # Every 10 minutes, so no overlapping jobs
  concurrencyPolicy: "Replace" # Replaces the current schedule if for some reason the previous one didn't finish or started late
