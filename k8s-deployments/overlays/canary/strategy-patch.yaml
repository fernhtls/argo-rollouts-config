apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: argo-rollouts-deployment
spec:
  strategy:
    canary:
      analysis:
        templates:
        - templateName: canary-latency
        - templateName: canary-errors-new-rollout
        startingStep: 2 # delay starting analysis run until setWeight: 50%
        args:
        - name: app-name
          value: argo-rollouts-deployment
        - name: predict-endpoint
          value: predict
        - name: canary-hash
          valueFrom:
            podTemplateHashValue: Latest
      steps:
        - setWeight: 20 
        - pause: {duration: 5m}
        - setWeight: 50 
        - pause: {duration: 8m}
        - setWeight: 70 
        - pause: {duration: 5m}
        - setWeight: 90 
        - pause: {duration: 5m}
