apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: argo-rollouts-deployment
spec:
  strategy:
    canary:
      analysis:
        templates:
        - templateName: canary-latency 
        startingStep: 2 # delay starting analysis run until setWeight: 40%
        args:
        - name: app-name
          value: argo-rollouts-deployment
        - name: predict-endpoint
          value: predict
        - name: latest-version 
        - name: canary-hash
          valueFrom:
            podTemplateHashValue: Latest
        - name: stable-hash
          valueFrom:
            podTemplateHashValue: Stable
      steps:
        - setWeight: 20 
        - pause: {duration: 5m}
        - setWeight: 40
        - pause: {duration: 5m}
        - setWeight: 60 
        - pause: {duration: 5m}
        - setWeight: 80 
        - pause: {duration: 5m}
